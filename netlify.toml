# ==============================================================================
# Netlify Configuration for QuizMania Public Platform (quizmania.atreyakamat.dev)
# ==============================================================================

[build]
  base = "."
  command = "npm run build:public && (test -d .next || ln -s apps/public/.next .next)"
  publish = "apps/public/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SUPABASE_URL = "https://eaqmwvxggnyprletpklr.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_ZFw3OiXslVaUm-Ulo-0_jA_kHyD0y3O"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZFw3OiXslVaUm-Ulo-0_jA_kHyD0y3O"

[context.production.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://eaqmwvxggnyprletpklr.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_ZFw3OiXslVaUm-Ulo-0_jA_kHyD0y3O"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ZFw3OiXslVaUm-Ulo-0_jA_kHyD0y3O"


[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
