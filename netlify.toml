# ==============================================================================
# Netlify Configuration for QuizMania Public Platform (quizmania.atreyakamat.dev)
# ==============================================================================

[build]
  base = "."
  command = "npm run build --workspace=@quizmania/public"
  publish = "apps/public/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
