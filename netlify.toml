# ==============================================================================
# Netlify Configuration for QuizMania Public Platform (quizmania.atreyakamat.dev)
# ==============================================================================

[build]
  base = "."
  command = "npm run build:public && (test -d .next || ln -s apps/public/.next .next)"
  publish = "apps/public/.next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
