# ==============================================================================
# Netlify Configuration for apps/public (when base directory is apps/public)
# ==============================================================================

[build]
  command = "npm run build:public && (test -d .next || ln -s apps/public/.next .next)"
  publish = "apps/public/.next"

[build.environment]
